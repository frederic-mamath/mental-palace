<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Sheeping Goat's head: golden L-shaped horns, floppy ears, a woolly cap over a cream face -->
  <g stroke="#1a1626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Horns: rise, run back (outward here), tip lifting -->
    <path d="M22 16 C19 9 13 9 8 10 C5 10 4 7 5 5" fill="none" stroke-width="7"/>
    <path d="M42 16 C45 9 51 9 56 10 C59 10 60 7 59 5" fill="none" stroke-width="7"/>
    <path d="M22 16 C19 9 13 9 8 10 C5 10 4 7 5 5" fill="none" stroke="#d4a72c" stroke-width="3.5"/>
    <path d="M42 16 C45 9 51 9 56 10 C59 10 60 7 59 5" fill="none" stroke="#d4a72c" stroke-width="3.5"/>
    <!-- Ears -->
    <ellipse cx="9" cy="35" rx="8" ry="4.5" fill="#f1c2ad" transform="rotate(20 9 35)"/>
    <ellipse cx="55" cy="35" rx="8" ry="4.5" fill="#f1c2ad" transform="rotate(-20 55 35)"/>
  </g>
  <!-- Wool cap: outlined circles first, then the same circles filled on top, so only the outer edge stays inked -->
  <g fill="#1a1626">
    <circle cx="32" cy="24" r="17.5"/>
    <circle cx="18" cy="30" r="10.5"/>
    <circle cx="46" cy="30" r="10.5"/>
    <circle cx="22" cy="17" r="9.5"/>
    <circle cx="42" cy="17" r="9.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="24" r="15.5"/>
    <circle cx="18" cy="30" r="8.5"/>
    <circle cx="46" cy="30" r="8.5"/>
    <circle cx="22" cy="17" r="7.5"/>
    <circle cx="42" cy="17" r="7.5"/>
  </g>
  <!-- Face under the fringe -->
  <ellipse cx="32" cy="41" rx="14" ry="12" fill="#f6e2cf" stroke="#1a1626" stroke-width="2.5"/>
  <ellipse cx="26" cy="39" rx="2.4" ry="2.9" fill="#1a1626"/>
  <ellipse cx="38" cy="39" rx="2.4" ry="2.9" fill="#1a1626"/>
  <circle cx="25.2" cy="37.9" r="0.9" fill="#ffffff"/>
  <circle cx="37.2" cy="37.9" r="0.9" fill="#ffffff"/>
  <ellipse cx="21.5" cy="44" rx="3" ry="2" fill="#f4a3a3"/>
  <ellipse cx="42.5" cy="44" rx="3" ry="2" fill="#f4a3a3"/>
  <path d="M29 45 Q30.5 47.2 32 45 Q33.5 47.2 35 45" fill="none" stroke="#3a2a2a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
